<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Vywee">
  <title>Vywee</title>
  <!--
    Single flat colour, no gradient. `currentColor` is not used here because
    favicons render outside any page CSS context; the navy is stated
    explicitly so the mark is identical in every browser tab, bookmark bar
    and PWA surface.
  -->
  <path
    d="M8.6 6.4 L16.2 19.4"
    fill="none"
    stroke="#2A3B7D"
    stroke-width="5.4"
    stroke-linecap="round"
  />
  <path
    d="M24.0 6.4 L14.2 23.6 Q11.6 28.2 7.6 26.2"
    fill="none"
    stroke="#2A3B7D"
    stroke-width="5.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
